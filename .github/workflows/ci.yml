name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Ensure only one CI run happens per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Turbo's git integration

      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**.md'

      - name: 2. Setup Node.js (Current)
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup Bun (Stable)
        if: steps.filter.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: 4. Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: 5. Verify Workspace Integrity
        if: steps.filter.outputs.code == 'true'
        run: bun run check:bun

      - name: 6. Lint
        if: steps.filter.outputs.code == 'true'
        run: bun run lint

      - name: 7. Build Project
        if: steps.filter.outputs.code == 'true'
        run: bun run build

      - name: 8. Run Unit Tests
        if: steps.filter.outputs.code == 'true'
        run: bun run test

      - name: 8a. Test Release Notes
        if: steps.filter.outputs.code == 'true'
        run: bun run test:release-notes

      - name: 9. Install Playwright Browsers
        if: steps.filter.outputs.code == 'true'
        run: bunx playwright install --with-deps chromium

      - name: 10. Run E2E Smoke Tests
        if: steps.filter.outputs.code == 'true'
        run: bun run test:e2e

      - name: 11. Upload Playwright Artifacts
        if: failure() && steps.filter.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
