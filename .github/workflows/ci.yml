name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled. Pushes get a group per commit, because GitHub also cancels a group's pending run
# when a newer one queues, and releases need a finished CI run on the exact commit they ship.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Turbo's git integration

      # Docs-only PRs skip the checks. Commits on main always run them, since a release trusts that commit's result.
      - name: Check for code changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**.md'

      - name: Setup Node.js
        if: steps.filter.outputs.code != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        if: steps.filter.outputs.code != 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        if: steps.filter.outputs.code != 'false'
        run: bun install --frozen-lockfile

      - name: Check Bun is installed
        if: steps.filter.outputs.code != 'false'
        run: bun run check:bun

      - name: Lint
        if: steps.filter.outputs.code != 'false'
        run: bun run lint

      - name: Build
        if: steps.filter.outputs.code != 'false'
        run: bun run build

      - name: Unit tests
        if: steps.filter.outputs.code != 'false'
        run: bun run test

      - name: Script tests
        if: steps.filter.outputs.code != 'false'
        run: bun run test:scripts

      - name: Install Playwright browsers
        if: steps.filter.outputs.code != 'false'
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        if: steps.filter.outputs.code != 'false'
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure() && steps.filter.outputs.code != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
