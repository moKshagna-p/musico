name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Turbo's git integration

      - name: 2. Setup Bun (Stable)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: 3. Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Install dependencies
        run: bun install --frozen-lockfile

      - name: 5. Verify Workspace Integrity
        run: bun run check:bun

      - name: 6. Lint
        run: bun run lint

      - name: 7. Build Project
        run: bun run build

      - name: 8. Run Unit Tests
        run: bun run test
