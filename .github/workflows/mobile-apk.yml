name: Mobile APK

# A sideloadable arm64 APK for every PR that touches the app, so it can be tried on a phone before it merges.
# Releases build their own in release.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      # The web files the app imports (grep "web/src/" apps/mobile/src).
      - 'apps/web/src/services/**'
      - 'apps/web/src/utils/**'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches the Gradle distribution, dependencies and build cache. PR runs write too, so a PR's later pushes reuse
      # its first build (the default only writes from main, which never runs this workflow).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release APK
        working-directory: apps/mobile
        run: |
          bunx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: musico-arm64-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
