name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.0.1)'
        required: true
      target_ref:
        description: 'Branch, tag, or SHA to release'
        required: false
        default: 'main'
      base_ref:
        description: 'Optional base tag/SHA for generated notes'
        required: false
      release_body:
        description: 'Custom release notes (leave empty to auto-generate)'
        required: false

permissions:
  contents: write

# Cancel older release runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  # main only takes merges that passed CI, and CI runs again on the merged commit, so the release reuses that
  # result instead of repeating the same lint, build and test run. Later jobs deploy this exact commit, so a merge
  # landing while the release waits can't ship untested.
  checks:
    name: Require Green CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - name: Wait for CI on the release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref || github.sha }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_REF" -q .sha)
          echo "Release commit: $sha"
          on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" -q .status)
          if [ "$on_main" != identical ] && [ "$on_main" != ahead ]; then
            echo "$sha is not on main. Merge it first; only merged commits can be released." >&2
            exit 1
          fi
          # Only push runs on main count: a PR run tested the merge ref, and docs-only PRs skip every step.
          # A tag pushed right after a merge can arrive before that run has been created.
          deadline=$((SECONDS + 300))
          while :; do
            if ! run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --event push --branch main \
              --json databaseId,status,conclusion -q 'sort_by(.databaseId) | last // empty | "\(.status) \(.conclusion)"'); then
              echo 'Could not read CI status; retrying.' >&2; sleep 15; continue
            fi
            case "$run" in
              "completed success") echo 'CI passed.'; echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0 ;;
              completed*) echo "CI finished as '${run#completed }' for $sha. Rerun that CI run, then rerun this release." >&2; exit 1 ;;
              "")
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "No CI run appeared for $sha within 5 minutes. Run CI on main, then rerun this release." >&2; exit 1
                fi
                echo 'CI has not started yet; waiting.'; sleep 15 ;;
              *) echo "CI is $run; waiting."; sleep 15 ;;
            esac
          done

  # Releases are grouped per tag above, so two tags can run at once. A concurrency group would cancel all but one
  # waiting run, so instead each release waits here for every older one to finish, and they migrate and deploy in
  # order. This is its own job so the wait gets GitHub's full 6-hour budget instead of eating into the migration's.
  queue:
    name: Wait for Earlier Releases
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for older release runs to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            # A failed lookup means we can't tell whether an older release is running, so retry rather than proceed.
            if ! older=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 50 --json databaseId,status \
              -q '.[] | select(.status != "completed" and .databaseId < ${{ github.run_id }}) | .databaseId'); then
              echo 'Could not list release runs; retrying.' >&2
            elif [ -z "$older" ]; then
              break
            else
              echo "Waiting for earlier release runs: $(echo $older)"
            fi
            sleep 20
          done

      # Checked only once earlier releases have finished, so one that published while this run waited counts. This
      # also stops a rerun of an old release, which keeps its old run id and so never waits behind newer ones.
      - name: Refuse commits older than the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.checks.outputs.sha }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$latest" -q .status)" = ahead ]; then
            echo "$SHA is older than the latest release $latest. Roll back by reverting on main and releasing that." >&2
            exit 1
          fi
          echo "$SHA is not older than ${latest:-any release}."

  # Migrations are additive, so the schema lands before either deploy and the running code never meets a missing column.
  migrate:
    name: Migrate Database
    runs-on: ubuntu-latest
    needs: [checks, queue]
    timeout-minutes: 5
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Validate database secret
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo 'Missing required GitHub production environment secret: DATABASE_URL' >&2
            echo 'Add it under Settings -> Environments -> production -> Environment secrets, then rerun this release workflow.' >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        run: bun run db:migrate:api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [checks, migrate, deploy-web]
    timeout-minutes: 10
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Validate Cloudflare deploy secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub production environment secrets: %s\n' "${missing[*]}" >&2
            printf 'Add them under Settings -> Environments -> production -> Environment secrets, then rerun this release workflow.\n' >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if bun run --cwd apps/api worker:deploy; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Cloudflare deployment failed after ${attempt} attempts." >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "Cloudflare deployment failed; retrying in ${sleep_seconds}s..." >&2
            sleep "$sleep_seconds"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [checks, migrate]
    timeout-minutes: 10
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Validate Vercel deploy secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=("VERCEL_TOKEN")
          [ -n "$VERCEL_ORG_ID" ] || missing+=("VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("VERCEL_PROJECT_ID")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub production environment secrets: %s\n' "${missing[*]}" >&2
            printf 'Add them under Settings -> Environments -> production -> Environment secrets, then rerun this release workflow.\n' >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull Vercel environment
        run: bunx vercel pull --yes --environment=production --local-config apps/web/vercel.json --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel project
        run: bunx vercel build --prod --local-config apps/web/vercel.json --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Vercel project
        run: bunx vercel deploy --prebuilt --prod --local-config apps/web/vercel.json --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - checks
      - deploy-api
      - deploy-web
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
      TARGET_REF: ${{ needs.checks.outputs.sha }}
      BASE_REF: ${{ inputs.base_ref }}
      CUSTOM_RELEASE_BODY: ${{ inputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Release Range
        id: range
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$BASE_REF" ]; then
            echo "base=$BASE_REF" >> "$GITHUB_OUTPUT"
            echo "Release notes will compare $BASE_REF..HEAD"
          else
            previous_tag="$(git tag --sort=-creatordate | grep -v "^${RELEASE_TAG}$" | head -n 1 || true)"
            if [ -n "$previous_tag" ]; then
              echo "base=$previous_tag" >> "$GITHUB_OUTPUT"
              echo "Release notes will compare $previous_tag..HEAD"
            else
              echo "base=" >> "$GITHUB_OUTPUT"
              echo "No previous release tag found. Release notes will compare HEAD^..HEAD."
            fi
          fi

      - name: Generate Release Notes
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$CUSTOM_RELEASE_BODY" ]; then
            printf '%s\n' "$CUSTOM_RELEASE_BODY" > release-notes.md
          else
            node scripts/generate-release-notes.mjs \
              --base "${{ steps.range.outputs.base }}" \
              --head HEAD \
              --out release-notes.md
          fi

      - name: Show Release Notes
        run: cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.TARGET_REF }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
