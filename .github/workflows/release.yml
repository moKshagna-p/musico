name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.0.1)'
        required: true
      target_ref:
        description: 'Branch, tag, or SHA to release'
        required: false
        default: 'main'
      base_ref:
        description: 'Optional base tag/SHA for generated notes'
        required: false
      release_body:
        description: 'Custom release notes (leave empty to auto-generate)'
        required: false

permissions:
  contents: write

# Cancel older release runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Release Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify workspace integrity
        run: bun run check:bun

      - name: Lint
        run: bun run lint

      - name: Build project
        run: bun run build

      - name: Run unit tests
        run: bun run test

      - name: Test release notes
        run: bun run test:release-notes

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: bun run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 10
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Validate Cloudflare deploy secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub production environment secrets: %s\n' "${missing[*]}" >&2
            printf 'Add them under Settings -> Environments -> production -> Environment secrets, then rerun this release workflow.\n' >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Cloudflare Worker
        run: bun run --cwd apps/api worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 10
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Validate Vercel deploy secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=("VERCEL_TOKEN")
          [ -n "$VERCEL_ORG_ID" ] || missing+=("VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("VERCEL_PROJECT_ID")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub production environment secrets: %s\n' "${missing[*]}" >&2
            printf 'Add them under Settings -> Environments -> production -> Environment secrets, then rerun this release workflow.\n' >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --cwd apps/web --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel project
        run: npx vercel build --prod --cwd apps/web --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Vercel project
        run: npx vercel deploy --prebuilt --prod --cwd apps/web --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - deploy-api
      - deploy-web
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
      TARGET_REF: ${{ inputs.target_ref || github.sha }}
      BASE_REF: ${{ inputs.base_ref }}
      CUSTOM_RELEASE_BODY: ${{ inputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Release Range
        id: range
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$BASE_REF" ]; then
            echo "base=$BASE_REF" >> "$GITHUB_OUTPUT"
            echo "Release notes will compare $BASE_REF..HEAD"
          else
            previous_tag="$(git tag --sort=-creatordate | grep -v "^${RELEASE_TAG}$" | head -n 1 || true)"
            if [ -n "$previous_tag" ]; then
              echo "base=$previous_tag" >> "$GITHUB_OUTPUT"
              echo "Release notes will compare $previous_tag..HEAD"
            else
              echo "base=" >> "$GITHUB_OUTPUT"
              echo "No previous release tag found. Release notes will compare HEAD^..HEAD."
            fi
          fi

      - name: Generate Release Notes
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$CUSTOM_RELEASE_BODY" ]; then
            printf '%s\n' "$CUSTOM_RELEASE_BODY" > release-notes.md
          else
            node scripts/generate-release-notes.mjs \
              --base "${{ steps.range.outputs.base }}" \
              --head HEAD \
              --out release-notes.md
          fi

      - name: Show Release Notes
        run: cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.TARGET_REF }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
