name = "musico-api"
main = "worker.ts"
compatibility_date = "2026-04-22"
compatibility_flags = ["nodejs_compat"]

[build]
command = "cd ../.. && bun install --frozen-lockfile"

# Run next to Neon (Singapore) instead of at the visitor's edge: most requests make several sequential DB round trips.
[placement]
mode = "smart"

[observability]
enabled = true

[triggers]
crons = ["0 */6 * * *"]

[vars]
ALLOWED_ORIGIN = "https://musico-web.vercel.app"
DISCOGS_USER_AGENT = "musico/1.0 (+https://musico-web.vercel.app)"

DISCOGS_RELAY_URL = "https://musico-web.vercel.app/api/discogs"

# Review images. Create once with `bunx wrangler r2 bucket create musico-media` before deploying.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "musico-media"
